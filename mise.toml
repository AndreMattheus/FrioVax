[tools]
go = "1.27"
java = "temurin-25"
maven = "3.9.16"
buf = "1.75.0"

[tasks.proto-lint]
description = "Valida o contrato Protobuf com STANDARD e COMMENTS"
dir = "protos"
run = "buf lint"

[tasks.proto-generate]
description = "Gera os stubs Go com plugins locais de versões fixadas (primeiro uso requer internet)"
dir = "protos"
run = "buf generate"

[tasks.proto-check]
description = "Valida e regenera o contrato, exigindo gerados Go sincronizados com o Git"
run = [
  "mise run proto-lint",
  "mise run proto-generate",
  "git diff --exit-code -- services/telemetry/gen",
  'untracked=$(git ls-files --others -- services/telemetry/gen) && if [ -n "$untracked" ]; then printf "%s\n" "$untracked"; exit 1; fi',
]
run_windows = [
  "mise run proto-lint",
  "mise run proto-generate",
  "git diff --exit-code -- services/telemetry/gen",
  'powershell -NoProfile -Command "$files = @(git ls-files --others -- services/telemetry/gen); if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; if ($files.Count -gt 0) { $files; exit 1 }"',
]

[tasks.build]
description = "Compila o serviço Java e o microsserviço Go"
run = [
  "mvn --batch-mode -f api/pom.xml -DskipTests package",
  "go -C services/telemetry build -o bin/telemetry ./cmd/server",
]

[tasks.test]
description = "Executa a suíte completa Java (test e integration-test) e Go"
run = [
  "mvn --batch-mode -f api/pom.xml verify",
  "go -C services/telemetry test ./...",
]

[tasks.test-unit]
description = "Executa testes Java de domínio, aplicação e suporte sem banco"
run = 'mvn --batch-mode -f api/pom.xml "-Dtest=**/dominio/*Test,**/aplicacao/*Test,**/suporte/*Test" test'

[tasks.test-http]
description = "Executa testes HTTP de câmaras, lotes e documentação com repositórios em memória"
run = 'mvn --batch-mode -f api/pom.xml "-Dtest=*HttpMemoriaTest" test'

[tasks.lint]
description = "Verifica contrato, formatação Java/Go e análise estática Go"
run = [
  "mise run proto-lint",
  "mvn --batch-mode -f api/pom.xml spotless:check",
  "test -z \"$(gofmt -l services/telemetry)\"",
  "go -C services/telemetry vet ./...",
]
run_windows = [
  "mise run proto-lint",
  "mvn --batch-mode -f api/pom.xml spotless:check",
  'powershell -NoProfile -Command "$files = @(gofmt -l services/telemetry); if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; if ($files.Count -gt 0) { $files; exit 1 }"',
  "go -C services/telemetry vet ./...",
]

[tasks.up]
description = "Sobe os serviços locais"
run = "docker compose up --build"

[tasks.test-race]
description = "Executa testes Go com detector de condições de corrida (Windows usa Docker com GCC)"
run = "go -C services/telemetry test -race ./..."
run_windows = 'docker run --rm --mount "type=bind,source={{config_root}}/services/telemetry,target=/src,readonly" --workdir /src golang:1.27 go test -race ./...'

[tasks.smoke]
description = "Constrói o Compose, verifica saúde/readiness e remove apenas o projeto descartável"
run = "python docs/scripts/smoke-compose.py"

[tasks.ci-java]
description = "Verifica lint/build e toda a suíte Java com um PostgreSQL descartável entre perfis"
run = "python docs/scripts/verificar-java.py"

[tasks.ci-processo]
description = "Reproduz as verificações Python de publicação, autenticação e evidências do CI"
env = { FRIOVAX_TEST_COMPOSE = "1" }
run = [
  "python -m unittest discover -s docs/scripts -p test_deploy.py -v",
  "python -m unittest discover -s docs/scripts -p test_preparar_auth_local.py -v",
  "python -m unittest discover -s docs/scripts -p test_medicao_sprint_2.py -v",
  "python -m unittest discover -s docs/scripts -p test_fluxo_de_valor.py -v",
  "python docs/scripts/validar-medicao-sprint-2.py",
  "python docs/scripts/medir-fluxo-de-valor.py itens",
  "python docs/scripts/medir-fluxo-de-valor.py revisao docs/evidencias/sprint-2/exportacoes/20261103T192538818629Z",
  "python docs/scripts/medir-fluxo-de-valor.py backlog",
]

[tasks.ci]
description = "Reproduz localmente o pipeline de CI"
run = [
  "mise run proto-check",
  "mise run ci-java",
  "test -z \"$(gofmt -l services/telemetry)\"",
  "go -C services/telemetry vet ./...",
  "go -C services/telemetry test ./...",
  "mise run test-race",
  "go -C services/telemetry build -o bin/telemetry ./cmd/server",
  "mise run ci-processo",
  "mise run smoke",
]
run_windows = [
  "mise run proto-check",
  "mise run ci-java",
  'powershell -NoProfile -Command "$files = @(gofmt -l services/telemetry); if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; if ($files.Count -gt 0) { $files; exit 1 }"',
  "go -C services/telemetry vet ./...",
  "go -C services/telemetry test ./...",
  "mise run test-race",
  "go -C services/telemetry build -o bin/telemetry.exe ./cmd/server",
  "mise run ci-processo",
  "mise run smoke",
]
