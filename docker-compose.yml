name: friovax

services:
  auth-init:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: local-auth
    volumes:
      - auth-data:/auth

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-friovax}
      POSTGRES_USER: ${DB_USER:-friovax}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-friovax}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    volumes:
      - auth-data:/run/secrets/auth:ro
    environment:
      FRIOVAX_LOCAL_AUTH: /run/secrets/auth/env.auth
      JWT_PRIVATE_KEY: /run/secrets/auth/privateKey.pem
      JWT_PUBLIC_KEY: /run/secrets/auth/publicKey.pem
      QUARKUS_HTTP_HOST: 0.0.0.0
      QUARKUS_FLYWAY_MIGRATE_AT_START: "true"
      RESUMO_CACHE_TTL: ${RESUMO_CACHE_TTL:-30s}
      TELEMETRY_GRPC_HOST: telemetry
      TELEMETRY_GRPC_PORT: "9090"
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-friovax}
      DB_USER: ${DB_USER:-friovax}
      DB_PASSWORD: ${DB_PASSWORD:-friovax}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "3", "http://localhost:8080/q/health/ready"]
      interval: 5s
      timeout: 4s
      start_period: 40s
      retries: 12
    depends_on:
      db:
        condition: service_healthy
      auth-init:
        condition: service_completed_successfully

  telemetry:
    build:
      context: ./services/telemetry
    environment:
      PORT: "8081"
      GRPC_PORT: "9090"
      GRPC_MAX_MESSAGE_BYTES: ${GRPC_MAX_MESSAGE_BYTES:-4194304}
      GRPC_MAX_CONCURRENT_ANALYSES: ${GRPC_MAX_CONCURRENT_ANALYSES:-16}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-5s}
    stop_grace_period: ${TELEMETRY_STOP_GRACE_PERIOD:-10s}
    ports:
      - "127.0.0.1:${TELEMETRY_HTTP_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 5s
      timeout: 2s
      retries: 10

volumes:
  db-data:
  auth-data:
