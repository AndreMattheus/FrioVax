name: friovax

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-friovax}
      POSTGRES_USER: ${DB_USER:-friovax}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-friovax}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
    environment:
      QUARKUS_HTTP_HOST: 0.0.0.0
      TELEMETRY_BASE_URL: http://telemetry:8081
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-friovax}
      DB_USER: ${DB_USER:-friovax}
      DB_PASSWORD: ${DB_PASSWORD:-friovax}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      telemetry:
        condition: service_healthy

  telemetry:
    build:
      context: ./services/telemetry
    environment:
      PORT: "8081"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 5s
      timeout: 2s
      retries: 10

volumes:
  db-data:
