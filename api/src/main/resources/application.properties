quarkus.application.name=friovax-api
quarkus.http.port=8080
quarkus.http.test-port=0
telemetry.base-url=${TELEMETRY_BASE_URL:http://localhost:8081}

# Banco de dados: em dev e test o Quarkus Dev Services sobe um PostgreSQL temporário.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:17-alpine
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/friovax}
%prod.quarkus.datasource.username=${DB_USER:friovax}
%prod.quarkus.datasource.password=${DB_PASSWORD:friovax}

# O esquema é gerenciado apenas pelo Flyway.
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true
