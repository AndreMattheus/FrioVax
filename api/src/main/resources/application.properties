quarkus.application.name=friovax-api
quarkus.http.port=8080
quarkus.http.test-port=0
telemetry.base-url=${TELEMETRY_BASE_URL:http://localhost:8081}

# Toda nova rota REST nasce bloqueada até declarar a permissão da operação.
quarkus.security.jaxrs.deny-unannotated-endpoints=true

# Banco de dados: em dev e test o Quarkus Dev Services sobe um PostgreSQL temporário.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:17-alpine
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/friovax}
%prod.quarkus.datasource.username=${DB_USER:friovax}
%prod.quarkus.datasource.password=${DB_PASSWORD:friovax}

# O esquema é gerenciado apenas pelo Flyway.
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true

# Especificação OpenAPI em /q/openapi e Swagger UI em /q/swagger-ui.
# A interface também é incluída no jar empacotado, usado pelo Docker Compose.
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.title=FrioVax API

# JWT RS256: cada ambiente fornece suas próprias chaves; sem chave padrão em produção.
mp.jwt.verify.issuer=${JWT_ISSUER:friovax-api}
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY}
mp.jwt.verify.publickey.algorithm=RS256
mp.jwt.verify.clock.skew=0
smallrye.jwt.required.claims=sub,upn,groups,iat,exp
# Nunca registrar parâmetros de SQL que contenham hashes ou credenciais.
quarkus.hibernate-orm.log.bind-parameters=false

# Provisionamento explícito, idempotente e desabilitado por padrão.
friovax.auth.demo.enabled=${AUTH_DEMO_ENABLED:false}
friovax.auth.demo.administrador=${AUTH_DEMO_ADMINISTRADOR:}
friovax.auth.demo.operador=${AUTH_DEMO_OPERADOR:}
friovax.auth.demo.auditor=${AUTH_DEMO_AUDITOR:}

# Chaves exclusivas de teste, somente no classpath de testes.
%test.mp.jwt.verify.publickey.location=auth/publicKey.pem
%test.smallrye.jwt.sign.key.location=auth/privateKey.pem
