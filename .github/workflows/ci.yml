name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  java:
    name: Java / Quarkus
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: api/pom.xml
      - name: Build e testes
        run: mvn --batch-mode -f api/pom.xml verify

  go:
    name: Go / Telemetria
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Configurar Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache-dependency-path: services/telemetry/go.mod
      - name: Verificar formatação
        run: test -z "$(gofmt -l services/telemetry)"
      - name: Análise estática
        run: go -C services/telemetry vet ./...
      - name: Testes
        run: go -C services/telemetry test ./...
      - name: Build
        run: go -C services/telemetry build -o bin/telemetry ./cmd/server
