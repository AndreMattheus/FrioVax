name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  java:
    name: Java / Quarkus
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: api/pom.xml
      - name: Verificar Docker para o PostgreSQL temporário
        run: docker info
      - name: Build e suíte completa (unitários, rotas, arquitetura e integração)
        run: mvn --batch-mode -f api/pom.xml verify
      - name: Verificar artefato executável do Quarkus
        run: test -f api/target/quarkus-app/quarkus-run.jar
      - name: Publicar relatórios de testes Java
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: |
            api/target/surefire-reports/
            api/target/failsafe-reports/
          if-no-files-found: warn

  go:
    name: Go / Telemetria
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Configurar Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache-dependency-path: services/telemetry/go.mod
      - name: Verificar formatação
        run: test -z "$(gofmt -l services/telemetry)"
      - name: Análise estática
        run: go -C services/telemetry vet ./...
      - name: Testes
        run: go -C services/telemetry test ./...
      - name: Build
        run: go -C services/telemetry build -o bin/telemetry ./cmd/server
